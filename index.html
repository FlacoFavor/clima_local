<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Clima Local - Sin Claves</title>
	<link rel="icon" type="image/svg+xml" href="icono.svg">
	<link rel="manifest" href="manifest.json">

	<script src="js/javascript.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }
        #icono { font-size: 80px; margin: 15px 0; }
        .temp { font-size: 55px; font-weight: bold; color: #def; }
        .desc { color: #666; font-size: 1.2rem; margin-bottom: 20px; }
        .loading { font-style: italic; color: #888; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #0056b3; }
		
		#icono {
    transition: transform 0.5s ease;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

/* Efecto de pulso para la probabilidad de lluvia */
.prob-lluvia {
    font-weight: bold;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
}

		
		@media (prefers-color-scheme: dark) {
			.card { background: #333; color: white; }
			.desc { color: #bbb; }
		}
    </style>
</head>
<body>

<div class="card">
    <div id="pantalla-carga">
        <p class="loading">Solicitando ubicación...</p>
    </div>

    <div id="info-clima" style="display: none;">
        <h2 id="ciudad">Cargando...</h2>
        <div id="icono">☀️</div>
        <div class="temp" id="temp">--°C</div>
        <div class="desc" id="desc">Despejado</div>
		<div id="pronostico" style="display: flex; justify-content: space-between; margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; width: 100%;">
			<!-- Las tarjetas se generan aquí -->
		</div><br><br>
        <button onclick="obtenerUbicacion()">Actualizar</button>
    </div>
    
    <p id="error-msg" style="color: red; font-size: 14px; margin-top: 15px;"></p>
</div>

</body>
</html>
