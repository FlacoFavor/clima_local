<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Clima Local - Sin Claves</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }
        #icono { font-size: 80px; margin: 15px 0; }
        .temp { font-size: 55px; font-weight: bold; color: #333; }
        .desc { color: #666; font-size: 1.2rem; margin-bottom: 20px; }
        .loading { font-style: italic; color: #888; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #0056b3; }
		
		#icono {
    transition: transform 0.5s ease;
    animation: float 3s ease-in-out infinite;
}
body {
    /* ... tus otros estilos ... */
    color: white; /* Hace que todo el texto por defecto sea blanco */
    transition: background 0.5s ease; /* Para que el cambio de color sea suave */
}

.card {
    /* Cambiamos el fondo de la tarjeta a uno semi-transparente o blanco puro */
    background: rgba(255, 255, 255, 0.9); 
    color: #333; /* El texto dentro de la tarjeta se queda oscuro para que resalte */
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    width: 320px;
    text-align: center;
}

/* Si prefieres que TODA la tarjeta sea oscura y el texto blanco: */
.card-dark {
    background: rgba(0, 0, 0, 0.7);
    color: white;
}
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

/* Efecto de pulso para la probabilidad de lluvia */
.prob-lluvia {
    font-weight: bold;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
}

		
		@media (prefers-color-scheme: dark) {
			.card { background: #333; color: white; }
			.desc { color: #bbb; }
		}
    </style>
</head>
<body>

<div class="card">
    <div id="pantalla-carga">
        <p class="loading">Solicitando ubicación...</p>
    </div>

    <div id="info-clima" style="display: none;">
        <h2 id="ciudad">Cargando...</h2>
        <div id="icono">☀️</div>
        <div class="temp" id="temp">--°C</div>
        <div class="desc" id="desc">Despejado</div>
		<div id="pronostico" style="display: flex; justify-content: space-between; margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; width: 100%;">
			<!-- Las tarjetas se generan aquí -->
		</div><br><br>
        <button onclick="obtenerUbicacion()">Actualizar</button>
    </div>
    
    <p id="error-msg" style="color: red; font-size: 14px; margin-top: 15px;"></p>
</div>

<script>
    // Se ejecuta al cargar la página
    window.onload = obtenerUbicacion;

    function obtenerUbicacion() {
        mostrarCarga(true);
        if (navigator.geolocation) {
            // Pide permiso al navegador
            navigator.geolocation.getCurrentPosition(consultarClima, manejarError);
        } else {
            mostrarError("Tu navegador no soporta geolocalización.");
        }
    }

    async function consultarClima(posicion) {
    const lat = posicion.coords.latitude;
    const lon = posicion.coords.longitude;

    try {
        // 1. Obtener el nombre de la ciudad (Geocodificación Inversa)
        const geoUrl = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`;
        const geoRes = await fetch(geoUrl);
        const geoData = await geoRes.json();
        const nombreCiudad = geoData.city || geoData.locality || "Ubicación desconocida";

        // 2. Obtener el clima
        const climaUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=4`;
        
        const respuesta = await fetch(climaUrl);
        const datosClima = await respuesta.json();

        // 3. Actualizar Interfaz (Pasamos el nombre de la ciudad también)
        actualizarInterfaz(datosClima, nombreCiudad);

    } catch (error) {
        console.error(error);
        mostrarError("Error al obtener datos");
    }
}


    function actualizarInterfaz(datos, nombreCiudad) { // Añade 'nombreCiudad' aquí
    mostrarCarga(false);
    
    // Ahora ponemos el nombre real que obtuvimos
    document.getElementById('ciudad').textContent = nombreCiudad;
    
    // --- CLIMA ACTUAL ---
    const tempActual = Math.round(datos.current.temperature_2m);
    document.getElementById('temp').textContent = `${tempActual}°C`;
    const infoActual = obtenerInfoClima(datos.current.weather_code);
    document.getElementById('icono').textContent = infoActual.ico;
    document.getElementById('desc').textContent = infoActual.txt;

    // --- PRONÓSTICO 3 DÍAS ---
    const pronosticoDiv = document.getElementById('pronostico');
    pronosticoDiv.innerHTML = ""; 

    for (let i = 1; i <= 3; i++) {
        const diaData = obtenerInfoClima(datos.daily.weather_code[i]);
        const max = Math.round(datos.daily.temperature_2m_max[i]);
        const min = Math.round(datos.daily.temperature_2m_min[i]);
        const lluvia = datos.daily.precipitation_probability_max[i]; // <--- Nuevo dato
        
        const fecha = new Date(datos.daily.time[i]);
        const nombreDia = fecha.toLocaleDateString('es-ES', { weekday: 'short' });

        pronosticoDiv.innerHTML += `
            <div style="font-size: 13px; text-align: center;">
                <div style="color: #888; text-transform: capitalize;">${nombreDia}</div>
                <div style="font-size: 25px; margin: 2px 0;">${diaData.ico}</div>
                <div style="font-weight: bold;">${max}° / <span style="color: #aaa;">${min}°</span></div>
                <div class="prob-lluvia" style="color: #007bff; font-size: 11px; margin-top: 4px;">
					💧 ${lluvia}%
				</div>
            </div>
        `;
    }
	function obtenerInfoClima(codigo) {
    const mapeo = {
        0: { txt: "Despejado", ico: "☀️" },
        1: { txt: "Casi despejado", ico: "🌤️" },
        2: { txt: "Nubes y claros", ico: "⛅" },
        3: { txt: "Nublado", ico: "☁️" },
        45: { txt: "Niebla", ico: "🌫️" },
        61: { txt: "Lluvia ligera", ico: "🌦️" },
        63: { txt: "Lluvia", ico: "🌧️" },
        80: { txt: "Chubascos", ico: "🌧️" },
        95: { txt: "Tormenta", ico: "⛈️" }
    };
    return mapeo[codigo] || { txt: "Variado", ico: "🌈" };
}
// Cambia el fondo según si es de día (código 0-3) o hay mal tiempo
const fondo = (datos.current.weather_code <= 3) ? 
    'linear-gradient(135deg, #00c6ff 0%, #0072ff 100%)' : // Azul cielo
    'linear-gradient(135deg, #606c88 0%, #3f4c6b 100%)'; // Gris tormenta
document.body.style.background = fondo;


// Si la temperatura es baja, ponemos un fondo azul frío, si es alta, uno cálido
const temp = Math.round(datos.current.temperature_2m);
if (temp < 15) {
    document.body.style.background = "linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)"; // Azul oscuro
} else {
    document.body.style.background = "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)"; // Rosa/Naranja cálido
}

// Forzamos que el texto de la temperatura sea negro si la tarjeta es blanca
document.getElementById('temp').style.color = "#333";
document.getElementById('ciudad').style.color = "#222";

}



    function mostrarCarga(visible) {
        document.getElementById('pantalla-carga').style.display = visible ? 'block' : 'none';
        document.getElementById('info-clima').style.display = visible ? 'none' : 'block';
        document.getElementById('error-msg').textContent = "";
    }

    function mostrarError(mensaje) {
        document.getElementById('pantalla-carga').style.display = 'none';
        document.getElementById('error-msg').textContent = mensaje;
    }

    function manejarError(error) {
        switch(error.code) {
            case error.PERMISSION_DENIED:
                mostrarError("Debes permitir el acceso a tu ubicación.");
                break;
            default:
                mostrarError("Ubicación no disponible.");
                break;
        }
    }
</script>

</body>
</html>
